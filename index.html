[`The Flatiron Building is one of the most famous historic landmarks in New York. The iconic twenty-one story building, best known for its triangular shape, was one of the early spectacular high-rises that have come to define Manhattan.\n\nThe Flatiron Building was constructed between 1901 and 1903 at the intersection of Broadway and Fifth Avenue, at the time one of the most prominent locations in New York City. It is situated near Madison Square at the end of the Ladies' Mile, one of Manhattan's most important shopping districts at the turn of the nineteenth century.\n\nThe Flatiron Building was designed by Chicago's Daniel Burnham as a steel-frame skyscraper clad in white terra-cotta. At 21 stories and 93 meters, it was one of the city's tallest buildings. Its singular shape and prominent location soon made it one of New York City's most famous landmarks.\n\nThe building probably featured on more postcards than any other building of its time. The whole area, the Flatiron district, was even named after the building. Originally, the Flatiron Building featured an observation deck on the top floor, but taller buildings have taken over this function. It is still, however, a popular tourist attraction, and one of the most photographed landmarks in New York.`,[['The text highlights ....',['the unique material of the building','the simple construction of the building','the common function of the building','the attractive aspects of the building'],3],['The text describes The Flatiron Building related to its ....',['color, shape, price, size, location','weight, length, function, size, location','height, shape, material, location, function','location, history, material, size, age'],2],['Because there are other taller building in the city, the Flatiron building changes ....',['its shape','its function','its location','its name'],1],['"..., it was one of the city\'s tallest building." (paragraph 3) The word \'it\' refers to ....',['a landmark','The Flatiron Building','a steel- [`Once upon a time, there was a young man called Ma Liang. He was poor. He helped a rich bad man to tend cattle. He liked drawing and drew pictures everywhere. One night, he dreamed that an old man gave him a magic paintbrush and asked him to use it to help poor people. When he woke up, he found the magic paintbrush in his desk.\n\nFrom that day on, he used the paintbrush to help people. Whenever he drew pictures, they became real. But a few days later, his master heard about the magic paint brush and stole it. He drew a lot of pictures, but they could not become real. He was very angry and asked some people to get Ma Liang.\n\nWhen Ma Liang came, he said to him, "If you draw some pictures for me and turn them to life, I will set you free." The young man said, "I can help you, but you should obey your words." The bad man felt very happy and said, "I want a golden mountain. I will go there to gather gold." The young man drew a sea first. Then the young man drew a golden mountain which was far away from the sea. After that he drew a big ship. The bad man jumped into the ship. When the ship sailed to the middle of the sea, the young man drew a large wave and it destroyed the ship. After that, the young man lived with his family happily and kept on helping the poor people. So the magic paintbrush was known by everyone.`,[['What is the topic of the story?',['A magic paintbrush and a helpful man.','A good painter and a greedy king.','A clever painter and a wise king.','A young man and his king.'],0],["If Ma Liang didn't do what the King asked he would ....",['live alone in the golden mountain','be poor','stayed in jail','lose in the sea'],2],["What would happen if Ma Liang didn't kill the King?",['The King would get a lot of gold.','The King would kill him.','He would get big prize from the King.',"He wouldn't be able to help poor people."],3],['How was Ma Liang like?',['smart and helpful','smart but greedy','humble and helpful','clever but cunning'],0]]],
[`The word tornado is from the Spanish word tronada, which means "thunderstorm". It is a violent, dangerous, rotating column of air which is in contact with both the surface of the earth and a cumulonimbus cloud. Cumulonimbus cloud is a type of cloud that is tall, dense, and involved in thunderstorms and other intense weather. It is a result of atmospheric instability.\n\nTornadoes come in many sizes but are typically in the form of a visible condensation funnel. It is a funnel-shaped cloud of condensed water droplets, associated with a rotating column of wind and extending form the base of a cloud. This funnel's narrow end touches the earth and is often encircled by a cloud of debris and dust. Most tornadoes have wind speeds, between 64 km/h and 179 km/h.\n\nAlthough tornadoes have been observed on every continent except Antarctica most occur in the United States. They also commonly occur in Southern Canada, South-Central and Eastern Asia, East Central South America.`,[['What is the text mostly about?',['The formation and the shape of tornado.','The effect and the size of tornado.','The cause and the danger of tornado.','The kinds and the effect of tornado.'],0],['Tornado happens because of the air, the earth and a cumulonimbus cloud ....',['come in different time','touch each other','meets in large places','leave after one another'],1],["What happens when the funnel's narrow end touches the earth?",['Debris and dust will be vanished.','It will bring debris and dust.','It will destroy debris and dust.','Debris and dust will be buried.'],1],['Who probably writes the text?',['A reporter','A scientist','A student','A historian'],1]]],
[`Chameleon Facts\n\nChameleon is a type of lizard. There are around 160 species of chameleons which can be found mostly on the Madagascar (half of all species live there), in the Africa, southern Europe, south Asia and Sri Lanka. Some chameleon species are endangered due to habitat loss and destruction and because they are sold as pets.\n\nChameleons have unique eyes, which can move separately from each other and achieve visual field of 180 degrees. This way chameleon can watch in two different directions at the same time and detect objects on the opposite sides. Eyes move rotationally and together provide visual field of 360 degrees.\n\nChameleons are vary in size. The smallest chameleon is Brookesia micra, which reaches 0,6 inches in length. The biggest chameleon is Furcifer oustaleti, which reaches 30 inches in length.\n\nChameleons prefer life in the forest and they adapted to move in the trees. Their toes are divided in two groups of two or three toes on each foot, which help them grab the branch and achieve stability during walking. Chameleons move slowly, using one limb at the time. Chameleons also use their long tail when moving in the trees to grab a branch and secure their position.`,[["What is the writer's intention to write the text?",['To explain how chameleons detect the object.','To inform about some endangered chameleons.','To describe chameleon species in general.','To tell how chameleons move their bodies.'],2],['How can a chameleon hunt its prey or ran away from predator?',['With its unusual toes','With its unique eyes','With its moving ability','With its long tail'],1],['How do a chameleon climb up on trees?',['By moving slowly along the tree with its tail','By seizing the branch of tree with its tail and toes','By pulling its limb on the stem of the tree',"By walking along the tree's stem with its toes"],1]]],
[`It was almost 6 A.M. Andi was hurriedly packing up his things. He had to catch up the 7 A.M train to Surabaya. At 6.30 A.M a taxi was coming to pick him up. He asked the driver to rush because his train was at 7 A.M. The traffic was very crowded. When he arrived at the station, the time showed 7.15 A.M. The train had already left.`,[['What can you learn from the text? Andi should have....',['driven the car himself','left early','worn his watch','left his things'],1],['Why was Andi late to arrive at the station? Because ...',['he took taxi','the driver was driving slowly','he got up late','the driver was late'],2],['Andi arrived at the train station ... the train had already left.',['but','and','so','if'],0]]],
[`ONCE upon a time, a grandmother and her granddaughter lived in Roti Island, Nusa Tenggara Timur. They had a field and grew some vegetables. The grandmother sold them at the market.\n\nIn one morning, the grandmother would go to the market. Before she left, she asked her granddaughter to cook.\n"Please cook some rice for lunch. But just cook one grain of rice. It's enough for both of us."\n"Why, Grandma?" asked the girl.\n"Just do what I said."\n\nThe grandmother then left for the market. Later, the girl started to cook. However, she felt a grain of rice would not be enough for them.\n"I think it's not enough for me and my grandmother." Then she took two handfuls of rice. Suddenly, something bad happened to the rice pot. "Oh, no! The rice flowed out of the pot!" shouted the girl. "What should I do? The rice became rice porridge. It flowed and flowed until it covered the kitchen. Suddenly, the grandmother came home. The girl explained what happened.\n\n"You are naughty girl! Why didn't you listen to me?" The grandmother was so angry. She hit the girl with a wooden stick.\n"Please forgive me, Granma!" The little girl cried and cried. But the grandmother kept hitting her.\n\nThen, an incredible thing happened! The girl turned into a monkey. The monkey then ran away and climbed a tree. The grandmother chased it. From the tree, the monkey said, "Grandmother, I'm a monkey now. I cannot live with you anymore. You are all alone."\n\nThe monkey climbed up and disappeared. The grandmother was very sad. She regretted what she had done to her beloved granddaughter. "Please come back to me. Please forgive me, my granddaughter!" but it was too late.\n\nThe little girl has turned into a monkey and never came home. The people of Roti Island believe this story. And that is until now; people in the Roti Island never hit their children or other people's child. They are afraid that the child would turn into a monkey. ***`,[['What is the purpose of the text above?',['to describe characters in a story','to tell what happened with the characters in a story','to argue why story is important','to teach moral value with a story'],1],['What happened when the granddaughter cooked the rice?',['The rice pot exploded','The girl turned into a monkey','The grandmother was so angry','The porridge flooded the kitchen'],3],['"The grandmother chased __it__." (paragraph 5) The word "it" refers to....',['thing','monkey','tree','wooden stick'],1]]],
